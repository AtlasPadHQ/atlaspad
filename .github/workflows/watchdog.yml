name: Watchdog (mainnet)
# Free scheduling for scripts/watchdog.mjs (docs/OPS-AUTOMATION.md): every 30 minutes, read-only, no keys.
# It does nothing until deploy/mainnet.json (with the ALT) is committed. A CRITICAL finding FAILS the run, so GitHub's
# failed-workflow email reaches you (free: the watchdog's email channel; GitHub emails the person who last changed the
# cron line below). With the optional ALERT_WEBHOOK_URL secret it is also posted to Discord (the watchdog's --alert).
# Secrets (all optional): ALERT_WEBHOOK_URL; MAINNET_RPC_URL or ALCHEMY_API_KEY (public RPC otherwise);
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (D1 admin_expectations and alerts; --no-d1 without them).
# This log is public on a public repo: --public-log prints D1 alerts as counts per severity and kind only (their full
# text reaches the operator by the Worker's alert email / webhook); a CRITICAL alert still fails the run.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog-mainnet
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mainnet live?
        id: live
        run: |
          # Live = go-mainnet recorded the ALT (step E3); a dry run's --record writes the file without it.
          if [ -f deploy/mainnet.json ] && jq -e '.alt // empty' deploy/mainnet.json > /dev/null; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deploy/mainnet.json has no ALT yet: mainnet is not live, nothing to watch."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.live.outputs.live == 'true'
        with:
          node-version: 22
      # node_modules restored whole (both lockfiles): keeps each run under one billed minute.
      - name: Restore node_modules
        id: nm
        if: steps.live.outputs.live == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            programs/shop-vault/client/node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'programs/shop-vault/client/package-lock.json') }}
      - name: Install
        if: steps.live.outputs.live == 'true' && steps.nm.outputs.cache-hit != 'true'
        run: |
          npm run vault-client
          npm ci
      - name: Watchdog
        if: steps.live.outputs.live == 'true'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          # A keyed endpoint is masked in logs; the watchdog prints its origin only.
          RPC_URL: ${{ secrets.MAINNET_RPC_URL || (secrets.ALCHEMY_API_KEY && format('https://solana-mainnet.g.alchemy.com/v2/{0}', secrets.ALCHEMY_API_KEY)) || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: '1'
        run: |
          d1=--no-d1
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then d1=; fi
          [ -n "$ALERT_WEBHOOK_URL" ] || echo "::notice::No ALERT_WEBHOOK_URL secret: a critical finding fails this run and GitHub emails you (that is the alert)."
          set +e
          node scripts/watchdog.mjs --cluster mainnet --alert --public-log $d1
          code=$?
          set -e
          case "$code" in
            0) echo "watchdog: ok" ;;
            1) echo "::warning::watchdog: warnings (see the log); nothing critical" ;;
            # a failed run is the email alert: never turn this into a pass
            2) echo "::error::watchdog: CRITICAL. Act now: RUNBOOK section 8 'Alerts'."; exit 1 ;;
            *) echo "::error::watchdog could not run (exit $code): RPC or GitHub trouble; it retries in 30 minutes."; exit 1 ;;
          esac
