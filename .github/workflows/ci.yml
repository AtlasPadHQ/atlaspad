name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Weekly: the Rust tests run against freshly dumped MAINNET pump.fun programs, so a pump upgrade that breaks our
  # CPI paths shows up here before users hit it (docs/OPS-AUTOMATION.md "pump.fun upgrades").
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
# A read-only token for every job, fork pull requests included, whatever the repo default is.
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # build the local shop-vault client first: npm ci copies it into node_modules, dist/ included (not committed)
      - run: npm run vault-client
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scripts

  # programs/shop-vault: both SBF builds + size/flavour gates, then the LiteSVM tests (cargo test) against the real
  # pump programs dumped read-only from mainnet (tests/fixtures; drift from the committed manifest is reported).
  # On push / pull_request it runs only when programs/shop-vault or this file changed (one billed minute otherwise).
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGAVE_VERSION: v4.1.2
    defaults:
      run:
        working-directory: programs/shop-vault
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did the program change?
        id: changed
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(programs/shop-vault/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::programs/shop-vault unchanged: Rust tests skipped (they run weekly and on demand)."
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        if: steps.changed.outputs.run == 'true'
        with:
          toolchain: stable
      - name: Cache Agave CLI and platform tools
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: agave-${{ runner.os }}-${{ env.AGAVE_VERSION }}
      - name: Cache cargo
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            programs/shop-vault/target
          key: cargo-${{ runner.os }}-${{ hashFiles('programs/shop-vault/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install the Agave CLI
        if: steps.changed.outputs.run == 'true'
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/$AGAVE_VERSION/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build both flavours (size gate + flavour marker)
        if: steps.changed.outputs.run == 'true'
        run: |
          cargo build-sbf --features devnet --sbf-out-dir target/deploy-devnet
          cargo build-sbf --sbf-out-dir target/deploy
          scripts/check-artifact.sh target/deploy/shop_vault.so mainnet
          scripts/check-artifact.sh target/deploy-devnet/shop_vault.so devnet
      - name: Dump today's mainnet pump programs (read-only)
        if: steps.changed.outputs.run == 'true'
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL || (secrets.ALCHEMY_API_KEY && format('https://solana-mainnet.g.alchemy.com/v2/{0}', secrets.ALCHEMY_API_KEY)) || '' }}
        run: |
          [ -n "$RPC_URL" ] || unset RPC_URL
          scripts/dump-fixtures.sh
          # A pump upgrade since the committed manifest: the tests below run against the new binaries.
          for so in pump.so pump_fees.so mayhem.so pump_amm.so; do
            was=$(git show HEAD:programs/shop-vault/tests/fixtures/manifest.json | jq -r --arg f "$so" '.files[$f]')
            now=$(jq -r --arg f "$so" '.files[$f]' tests/fixtures/manifest.json)
            [ "$was" = "$now" ] || echo "::warning::mainnet $so changed since the committed fixture manifest: re-dump and re-capture (docs/OPS-AUTOMATION.md 'pump.fun upgrades')."
          done
      - name: cargo test
        if: steps.changed.outputs.run == 'true'
        run: cargo test --locked
