<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Roboto Flex'; src: url('RobotoFlex-latin.woff2') format('woff2'); font-weight: 100 1000; }
  html, body { margin: 0; width: 1500px; height: 500px; overflow: hidden; background: #0e7c47; font-family: 'Roboto Flex', system-ui, sans-serif; }
  .map { position: absolute; inset: 0; }
  /* X header: the avatar covers the bottom-left (about x 0-420, y 300-500) and phones crop ~60 px top and bottom,
     so everything that must be read sits in the middle band to the right */
  .pin { position: absolute; width: 46px; height: 62px; }
  .tag { position: absolute; background: #fff; color: #0e7c47; font-weight: 800; font-size: 20px; letter-spacing: 0.5px;
         padding: 5px 12px 6px; border-radius: 999px; white-space: nowrap; }
  .brand { position: absolute; left: 790px; top: 108px; width: 650px; color: #fff; }
  .row { display: flex; align-items: center; gap: 26px; }
  .tile { width: 104px; height: 104px; border-radius: 28px; background: #fff; display: grid; place-items: center; flex: none; }
  .word { font-size: 92px; font-weight: 900; letter-spacing: 3px; line-height: 1; font-variation-settings: 'wdth' 110; }
  .tagline { margin-top: 30px; font-size: 40px; font-weight: 700; line-height: 1.12; letter-spacing: -0.5px; }
  .tagline em { font-style: normal; color: #bdf2d3; }
  .sub { margin-top: 16px; font-size: 25px; font-weight: 500; color: rgba(255,255,255,0.88); }
</style>
</head>
<body>
