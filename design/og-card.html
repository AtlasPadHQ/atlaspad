<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <!-- The AtlasPad share card (1200×630, og:image / twitter:image). Rendered to public/og.png by
         `node scripts/og-card.mjs` (local headless Chrome, local fonts only). Brand green #0e7c47, the white app mark,
         the ATLASPAD wordmark in its own subset font (src/styles/fonts), Roboto Flex (brand/x) for the rest. No numbers, no badges:
         the card must stay true for every share. -->
    <title>AtlasPad share card</title>
    <style>
      @font-face {
        font-family: "CS Wordmark";
        src: url("../src/styles/fonts/roboto-flex-wordmark.woff2") format("woff2");
        font-weight: 100 1000;
        font-stretch: 25% 151%;
      }
      @font-face {
        font-family: "Roboto Flex";
        src: url("../brand/x/RobotoFlex-latin.woff2") format("woff2");
        font-weight: 100 1000;
        font-stretch: 25% 151%;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #0e7c47;
        color: #ffffff;
        font-family: "Roboto Flex", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .roads {
        position: absolute;
        inset: 0;
      }
      .card {
        position: absolute;
        inset: 0 0 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .mark {
        width: 112px;
        height: 112px;
        filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.18));
      }
      .word {
        font-family: "CS Wordmark";
        font-weight: 800;
        font-stretch: 120%;
        font-size: 112px;
        line-height: 1;
        letter-spacing: 3px;
      }
      .tag {
        margin-top: 40px;
        font-weight: 700;
        font-size: 50px;
        line-height: 1.15;
        letter-spacing: -0.3px;
      }
      .url {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 46px;
        text-align: center;
        font-weight: 600;
        font-size: 32px;
        letter-spacing: 0.4px;
        color: #d7f5e1;
      }
    </style>
  </head>
  <body>
    <!-- faint map roads: the product is a map -->
    <svg class="roads" viewBox="0 0 1200 630" aria-hidden="true">
      <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-linecap="round">
        <path d="M-60 500 L1260 220" stroke-width="28" />
        <path d="M-60 110 L1260 280" stroke-width="16" />
        <path d="M170 -40 L410 680" stroke-width="20" />
        <path d="M880 -40 L1020 680" stroke-width="24" />
        <path d="M560 690 L1260 400" stroke-width="12" />
        <path d="M-40 640 L300 -40" stroke-width="10" />
      </g>
    </svg>
    <div class="card">
      <div class="lockup">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="18" fill="#ffffff" />
          <path d="M32 12c-8.3 0-15 6.5-15 14.6C17 37.5 32 52 32 52s15-14.5 15-25.4C47 18.5 40.3 12 32 12z" fill="#0e7c47" />
          <circle cx="32" cy="26.5" r="8.6" fill="#ffffff" />
          <ellipse cx="32" cy="26.5" rx="3.5" ry="8.6" fill="none" stroke="#0e7c47" stroke-width="1.8" />
          <path d="M23.4 26.5h17.2" stroke="#0e7c47" stroke-width="1.8" />
        </svg>
        <div class="word">ATLASPAD</div>
      </div>
      <div class="tag">Launch a coin for any business on earth</div>
    </div>
    <div class="url">atlaspad.online</div>
  </body>
</html>
