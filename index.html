    <!-- Google Maps: connect early, and start the Maps JS download in parallel with the app bundle (LCP, INTEGRATION.md §8).
         Same URL parameters as src/lib/google.ts, which picks this download up instead of starting its own. Skipped for
         ?map=demo and keyless builds. -->
    <link rel="preconnect" href="https://maps.googleapis.com" />
    <link rel="preconnect" href="https://maps.gstatic.com" crossorigin />
    <script>
      (function () {
        try {
          var k = '%VITE_GOOGLE_MAPS_KEY%';
          if (!k || k.charAt(0) === '%' || /[?&]map=demo(&|$)/.test(location.search)) return;
          var w = window;
          var g = (w.google = w.google || {});
          var m = (g.maps = g.maps || {});
          if (m.importLibrary) return;
          w.gm_authFailure = function () {
            w.__csMapsAuthFailed = true;
          };
          w.__csMapsBoot = new Promise(function (resolve, reject) {
            m.__ib__ = resolve;
            var s = document.createElement('script');
            var q = new URLSearchParams({ key: k, v: 'weekly', language: 'en-GB', region: 'GB', libraries: 'maps', callback: 'google.maps.__ib__' });
            s.src = 'https://maps.googleapis.com/maps/api/js?' + q.toString();
            s.async = true;
            // 3 KB on the map's critical path: an async script is fetched at Low priority and held back behind the
            // app bundle on slow connections (≈0.9 s on slow 4G), which delays every Maps module and the first view.
            s.fetchPriority = 'high';
            s.onerror = function () {
              reject(new Error('maps script'));
            };
            document.head.appendChild(s);
          });
          w.__csMapsBoot.catch(function () {});
        } catch (e) {}
      })();
    </script>

    <!-- Fonts (DESIGN §3.1, in this order; icon_names must stay alphabetical). Roboto Flex loads WITHOUT the wdth axis
